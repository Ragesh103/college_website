{% load static %}
{% include 'school/base.html' %}
<!DOCTYPE html>
<html lang="gr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <link rel="Stylesheet" href="{% static 'css/aboutus.css' %}" type="text/css">

</head>

<body>

    <div class="container-fluid text-center commonclass">
        <h4>Departments</h4>
    </div>

    <div class="container-fluid bg-grey">
        <div class="d-flex justify-content-end align-items-center mt-2">
            <a href="/add_dept"><button type="button" class="btn btn-outline-success btn-lg">Add Department</button></a>
        </div>





        <div class="row">
            {% for i in dep %}
            <div class="col-md-4 mb-4 mt-4">
                <div class="card p-4 shadow-sm h-100 text-center card-hover">
                    <div class="card-body">
                        <h5 class="card-title">{{ i.depname }}</h5>
                        <p class="card-text text-muted">{{ i.depcode }}</p>
                        <button type="button" class="btn btn-outline-danger mt-3">View Details</button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>


    </div>
















    <!-- {% include 'footer.html' %} -->
</body>

</html>
